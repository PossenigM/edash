[project]
name = "edash"
version = "0.1.0"
description = "E-ink office dashboard: a Raspberry Pi Zero 2W display fed by a laptop over USB serial"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matthias Possenig" }]
keywords = ["e-ink", "e-paper", "raspberry-pi", "dashboard", "microsoft-graph", "waveshare"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business",
]
dependencies = [
    "pillow>=10.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pyserial>=3.5",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
host = [
    "msal>=1.28",
    "msal-extensions>=1.2",
    "requests>=2.31",
    "jeepney>=0.8; sys_platform == 'linux'",
]
tray = ["pystray>=0.19"]
# On Raspberry Pi OS these come from apt (python3-*); the venv uses --system-site-packages.
device = [
    "spidev>=3.6; sys_platform == 'linux'",
    "gpiozero>=2.0; sys_platform == 'linux'",
]
dev = ["pytest>=8", "ruff==0.17.4"]

[project.urls]
Repository = "https://github.com/PossenigM/edash"

[project.scripts]
edash-host = "edash.host.cli:main"
edash-device = "edash.device.main:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edash"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
