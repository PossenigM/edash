[project]
name = "edash"
version = "0.1.0"
description = "E-ink office dashboard: a Raspberry Pi Zero 2W display fed by a laptop over USB serial"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pyserial>=3.5",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
# Laptop side: Microsoft Graph login + HTTP.
host = [
    "msal>=1.28",
    "msal-extensions>=1.2",
    "requests>=2.31",
    "jeepney>=0.8; sys_platform == 'linux'",  # logind sleep/lock events
]
tray = ["pystray>=0.19"]
# Pi side. spidev/gpiozero/lgpio come from apt (python3-*) on Raspberry Pi OS;
# the venv is created with --system-site-packages so pip sees them.
device = [
    "spidev>=3.6; sys_platform == 'linux'",
    "gpiozero>=2.0; sys_platform == 'linux'",
]
dev = ["pytest>=8"]

[project.scripts]
edash-host = "edash.host.cli:main"
edash-device = "edash.device.main:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
